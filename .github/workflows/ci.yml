name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Toolchain and components come from rust-toolchain.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The action defaults to deny; keep warnings as annotations.
          build-warnings: warn
      - name: Clippy
        run: cargo clippy --all-features
      - name: Check resume data
        run: cargo run --bin resume -- check
      - name: Build docs
        run: cargo doc --no-deps --verbose
      # Deployed next to the rustdoc; the format links on both expect this layout.
      - name: Build HTML, PDF and Markdown
        run: cargo run --bin resume -- generate --output target/doc --stars stars.json --verbose
      - name: SSH setup
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOYMENT_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519.ci
          echo "IdentityFile ~/.ssh/id_ed25519.ci" >> ~/.ssh/config
          chmod -R 700 ~/.ssh
      - name: Rsync deployment
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOYMENT_USER: ${{ secrets.DEPLOYMENT_USER }}
          DEPLOYMENT_HOST: ${{ secrets.DEPLOYMENT_HOST }}
          DEPLOYMENT_PORT: ${{ secrets.DEPLOYMENT_PORT }}
        run: |
          rsync -avz --rsh="ssh -p${DEPLOYMENT_PORT}" --delete target/doc/ ${DEPLOYMENT_USER}@${DEPLOYMENT_HOST}:/var/www/resume/
