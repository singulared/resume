[package]
name = "resume"
version = "0.4.1"
edition = "2024"
authors = ["Maxim Belousov <mail@singulared.space>"]
keywords = ["resume", "cv", "hr"]
description = "Maxim Belousov's resume"
documentation = "https://resume.singulared.space/resume/"
readme = "README.md"
homepage = "https://resume.singulared.space/"
repository = "https://github.com/singulared/resume"
license = "MIT"
categories = ["rust-patterns", "visualization"]
publish = false

[dependencies]
resume-macro = { path = "./resume-macro" }
simple-mermaid = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inventory = "0.3"
askama = "0.12"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
pulldown-cmark = "0.12"

[features]
team-lead = []
closed = []

[[bin]]
name = "resume"
path = "src/bin/resume.rs"
